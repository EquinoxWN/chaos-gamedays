[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-gamedays"
version = "0.1.0"
description = "Chaos experiment plans with a falsifiable hypothesis, blast radius and abort conditions, checked and sealed before a game day starts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-jsonschema", "pip-audit>=2.7"]

[project.scripts]
gameday = "chaos_gamedays.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chaos_gamedays = ["experiment.schema.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-p no:cacheprovider --basetemp=.tmp/pytest"

[tool.ruff]
line-length = 140
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["chaos_gamedays", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
cache_dir = ".tmp/mypy"
